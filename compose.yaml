name: wardrobe-agent
x-backend: &backend
  build: ./backend
  environment:
    WARDROBE_ENV_FILE: /config/.env
  restart: unless-stopped
  volumes:
    - ./backend:/app
    - .:/config:ro
  stop_grace_period: 35m
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    objectstore:
      condition: service_started
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wardrobe
      MYSQL_USER: wardrobe
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -uwardrobe -D wardrobe -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
    restart: unless-stopped
  objectstore:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - object_data:/data
    restart: unless-stopped
  api:
    <<: *backend
    command: sh -c 'alembic upgrade head && exec python -m app.dev_watch api'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
  worker:
    <<: *backend
    command: python -m app.dev_watch worker
    depends_on:
      api:
        condition: service_healthy
  beat:
    <<: *backend
    command: python -m app.dev_watch beat
    depends_on:
      api:
        condition: service_healthy
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    restart: unless-stopped
  gateway:
    image: nginx:alpine
    ports:
      - '127.0.0.1:${APP_PORT:-8088}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
volumes:
  mysql_data:
  redis_data:
  object_data:
  frontend_modules:
